        3465343439373966320a346564646164336462616137396564343633633130666563313034326336
        32613538613839353138653466373666373161623833303564373234313936663262
      ansible_become_password: '{{ ansible_password }}'

      bind_zones:
        - name: infra.brlin.me
          primaries:
            - '{{ ansible_host }}'
          name_servers:
            - rpi5.infra.brlin.me.
          networks:
            - 192.168.128
